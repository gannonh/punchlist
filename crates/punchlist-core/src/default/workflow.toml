# The built-in workflow a new workspace starts with (PRD, "The workflow file"), until its
# repository has a valid `.punchlist/workflow.toml` on the default branch (ADR 0010).
version = 1
statuses = ["backlog", "todo", "start", "in_progress", "agent_review",
            "human_review", "merging", "done", "canceled"]

[[transition]]
from = ["backlog", "merging"]    # merging: after a gate refused its merge
to = "todo"
by = ["person"]                  # approval

[[transition]]
from = "todo"
to = "start"
by = ["person"]                  # start signal

[[transition]]
from = "start"
to = "in_progress"
by = ["runner"]                  # a runner claims the issue

[[transition]]
from = "in_progress"
to = "agent_review"
by = ["agent"]
gates = ["pr_open", "pr_ready", "pr_names_issue"]

[[transition]]
from = "agent_review"
to = "human_review"
by = ["agent"]
gates = ["ci_green", "mergeable", "no_open_threads", "proof_attached"]

[[transition]]
from = "human_review"
to = "merging"
by = ["person"]

[[transition]]
from = "merging"
to = "done"
on = "pr_merged"

[[transition]]
from = ["in_progress", "agent_review"]
to = "todo"
on = "pr_closed_unmerged"
require = ["comment"]

[lock]
human_review = ["agent", "runner"]   # stand-down: agents cannot comment, push or be dispatched

[dispatch]
max_concurrent = 5

[dispatch.status.in_progress]
agent = "claude-code"
prompt = "prompts/in_progress.md"

[dispatch.status.agent_review]
agent = "codex"
prompt = "prompts/agent_review.md"

# `ci_green` passes when every check run on the head commit passed. To also require named
# checks, so that a branch that deletes its CI workflow does not pass, list them: a name is a
# check GitHub Actions produces, and a table names another GitHub App by its slug.
# [gate.ci_green]
# required = ["test", { name = "deploy", app = "vercel" }]

# `pl import linear` puts each Linear issue in the status named like its Linear state, else in
# the status for the state's type (backlog, unstarted → todo, started → in_progress,
# completed → done, canceled → canceled). A state that maps to no status, such as Triage, stops
# the import; map it, or override any other, here:
# [import.linear.states]
# "Triage" = "backlog"
# "QA" = "agent_review"
