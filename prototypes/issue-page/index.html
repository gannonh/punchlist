<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Punchlist · Issue page prototype</title>
  <link rel="stylesheet" href="../issue-list/styles.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Punchlist <span class="tag">prototype · issue page</span></div>
    <div class="switcher" role="group" aria-label="Layout">
      <button type="button" data-variant="sidebar" aria-pressed="true">Sidebar</button>
    </div>
    <div class="filters">
      <div class="switcher states" role="group" aria-label="Mock issue state">
        <button type="button" data-state="running" aria-pressed="true">Running</button>
        <button type="button" data-state="blocked" aria-pressed="false">Blocked</button>
        <button type="button" data-state="locked" aria-pressed="false">Human Review</button>
        <button type="button" data-state="done" aria-pressed="false">Done</button>
      </div>
      <label>View as
        <select id="viewer" aria-label="View as">
          <option value="gannon">Gannon Hall · person</option>
          <option value="claude">Claude Code · agent</option>
        </select>
      </label>
    </div>
  </header>

  <main id="view"></main>

  <footer class="shortcuts" id="shortcuts"></footer>
  <div id="overlay"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
